[package]
name = "bulbul-local-stt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "On-device speech-to-text for Bulbul: the model catalog, the local model store, the downloader and the transcriber interface."
publish = false

# Deliberately free of Tauri and of Bulbul's own types so it can be lifted out
# of this repository later. No native engine is linked here: the speech engine
# runs in a separate worker program, behind the `Transcriber` trait.

[features]
default = ["download"]
# The model downloader (HTTP, hashing, archive unpacking, free-space check).
# Off, the crate is just the catalog, the store and the trait.
download = ["dep:reqwest", "dep:tokio", "dep:sha2", "dep:tar", "dep:bzip2", "dep:fs4"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["fs", "time", "rt", "io-util", "sync"], optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.6", optional = true }
fs4 = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
